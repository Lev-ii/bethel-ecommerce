name: Purger les vues produit anciennes

# Efface les vues produit que le tableau de bord ne lit plus (plus de 24 mois,
# voir viewsRetentionCutoff).
#
# Jamais automatique : aucune donnee n'est supprimee sans decision de
# l'administrateur. Lancement manuel uniquement (Actions > Run workflow), avec
# confirmation ecrite.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Tapez SUPPRIMER pour effacer les vues de plus de 24 mois"
        required: true

jobs:
  purger:
    name: Effacer les vues de plus de 24 mois
    runs-on: ubuntu-latest

    steps:
      - name: Appeler la route de purge
        env:
          APP_URL: ${{ secrets.BETHEL_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -u
          if [ "${CONFIRMATION}" != "SUPPRIMER" ]; then
            echo "::error::Confirmation absente : rien n'a ete supprime."
            exit 1
          fi
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Secrets BETHEL_APP_URL ou CRON_SECRET absents du depot."
            exit 0
          fi

          code=$(curl -sS --max-time 30 -o reponse.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/purge-product-views")

          echo "HTTP ${code}"
          cat reponse.txt || true
          echo

          if [ "${code}" != "200" ]; then
            echo "::error::La purge des vues produit a echoue (HTTP ${code})."
            exit 1
          fi
