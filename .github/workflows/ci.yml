name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

# Une nouvelle poussee sur la meme branche annule la verification en cours :
# inutile de payer deux fois pour un etat depasse.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier les types
        run: npm run typecheck

      - name: Executer les tests unitaires
        run: npm test

      - name: Construire l'application
        run: npm run build
        env:
          # Valeurs de facade, jamais des secrets : le build ne contacte ni la
          # base ni Jeko, il lui faut seulement de quoi charger les modules.
          #
          # AUTH_SECRET : "next build" pose NODE_ENV=production, mode dans
          # lequel l'absence de secret est desormais une erreur.
          # DATABASE_URL : src/lib/db/client.ts construit le pool au chargement
          # du module. postgres.js n'ouvre la connexion qu'a la premiere
          # requete, et la collecte des routes n'en emet aucune.
          AUTH_SECRET: valeur-de-facade-pour-la-compilation
          DATABASE_URL: postgresql://bethel:bethel@localhost:5432/bethel
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  database:
    name: Stock et concurrence
    runs-on: ubuntu-latest

    # Le seul test qui prouve qu'un seul client obtient le dernier exemplaire
    # a besoin d'un vrai PostgreSQL : il verifie les verrous de ligne et les
    # contraintes CHECK, que rien ne peut simuler.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bethel
          POSTGRES_PASSWORD: bethel
          POSTGRES_DB: bethel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bethel:bethel@localhost:5432/bethel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Preparer la base (migrations sur base neuve, puis donnees)
        run: npm run db:setup

      - name: Migrations rejouables sans effet
        run: |
          npm run db:migrate | tee migration.log
          grep -q "Appliquees         : aucune" migration.log

      - name: Historique des commandes (filtres, pagination, recherche)
        run: npm run test:db

      - name: Deux clients sur le dernier exemplaire
        run: npm run test:concurrence
